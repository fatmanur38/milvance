# Milvance — zero-cost hackathon blueprint.
#
# ONE Render free web service and nothing else. PostgreSQL and private object
# storage are Supabase's free tier; the web app is Vercel Hobby.
#
#   Vercel (web) ──► Render free web service (NestJS API + indexer ticks)
#                         │                        ▲
#                         ├──► Stellar Testnet     │ every 60s
#                         └──► Supabase Postgres   │
#                                   Supabase Cron ─┘
#
# WHY THERE IS NO WORKER HERE
#
# Render's free tier has no background worker, so the indexer cannot be a
# process that sleeps and polls. It is instead a bounded tick that Supabase
# Cron calls once a minute, running the SAME ingestion and projection code the
# CLI worker runs (`indexer.main.ts watch` still works, unchanged, locally and
# on any paid plan). One tick, one writer: the tick takes a lease first, so a
# scheduler firing on top of a slow tick is a no-op rather than a second
# writer advancing one cursor.
#
# This is hackathon infrastructure. See docs/FREE_HACKATHON_DEPLOYMENT.md for
# what that costs in reliability, and README/DEPLOYMENT.md for the paid shape.
#
# NO SECRET IS IN THIS FILE. `sync: false` values are entered once in the
# Render dashboard and never enter the repository.

services:
  - type: web
    name: milvance-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      # Supabase → Connect → Session pooler. Copied, never generated: the
      # format and the host differ per project and must not be guessed.
      # Free-tier deploys have no pre-deploy hook, so `prisma migrate deploy`
      # is run by a human against this database before the service starts.
      - key: DATABASE_URL
        sync: false
      - key: WEB_URL
        sync: false # the public web origin, e.g. https://milvance.vercel.app
      # Presented by Supabase Cron as `Authorization: Bearer <value>`. Render
      # generates it so nobody has to invent one; read it from the dashboard
      # once and store it in Supabase Vault. Unset, the tick endpoint is
      # disabled rather than open.
      - key: INDEXER_CRON_SECRET
        generateValue: true
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_NETWORK_PASSPHRASE
        value: Test SDF Network ; September 2015
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: MILVANCE_CONTRACT_ID
        value: CCN6AZHLN2BQPCDZWXJGA3NRJEJ56V5JK3M4VZ5QFKQ3NSJBN6RVTKRX
      - key: USDC_ISSUER
        value: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      - key: USDC_ASSET_CONTRACT_ID
        value: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
      - key: ANCHOR_HOME_DOMAIN
        value: tr-mock-anchor.fly.dev
      # The ledger MilvanceCore was deployed in. A fresh database backfills the
      # whole history from here rather than starting at "now" and losing it.
      - key: INDEXER_START_LEDGER
        value: '4760607'
      # How much one scheduled tick may do before it stops and reports
      # `caughtUp: false`. A backlog is finished by later ticks; nothing is
      # ever skipped to make a tick end sooner.
      - key: INDEXER_TICK_MAX_PAGES
        value: '5'
      - key: INDEXER_TICK_MAX_EVENTS
        value: '500'
      - key: INDEXER_TICK_MAX_SECONDS
        value: '20'
      # Evidence: Supabase Storage over its S3-compatible endpoint, so
      # documents survive a redeploy. The bucket is PRIVATE; these credentials
      # are server-side only and can bypass Storage RLS, so they are full
      # server secrets and must never reach a browser bundle.
      - key: EVIDENCE_STORAGE_DRIVER
        value: s3
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false # https://<project-ref>.storage.supabase.co/storage/v1/s3
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false # the project's real region, e.g. eu-central-1 — not "auto"
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
