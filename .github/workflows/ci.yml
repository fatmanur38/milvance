name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Node workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contract:
    name: Soroban contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Prebuilt binary rather than `cargo install stellar-cli`: building from
      # source pulls libdbus-sys, whose system dependency (libdbus-1-dev) is not
      # present on ubuntu-latest, and took 13 minutes before failing.
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 28.0.0
        run: |
          set -euo pipefail
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o /tmp/stellar-cli.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          install -m 0755 /tmp/stellar "$HOME/.cargo/bin/stellar"
          stellar --version

      - run: stellar contract build

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Private development context and secrets must never enter the public repo.
      - name: Assert private files are not tracked
        run: |
          set -e
          for f in AGENT.md AGENTS.md MILVANCE_SSOT.md .env; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f must not be tracked in Git"
              exit 1
            fi
          done

      - name: Assert no committed key material
        run: |
          set -e
          if git ls-files | grep -E '\.(pem|key|jwt)$'; then
            echo "::error::key material must not be committed"
            exit 1
          fi
