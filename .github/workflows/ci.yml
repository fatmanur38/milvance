name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Node workspace
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://milvance:milvance@localhost:5432/milvance_test
      TEST_DATABASE_URL: postgresql://milvance:milvance@localhost:5432/milvance_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: milvance
          POSTGRES_PASSWORD: milvance
          POSTGRES_DB: milvance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U milvance -d milvance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @milvance/api db:generate
      - run: pnpm --filter @milvance/api db:migrate

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contract:
    name: Soroban contract
    runs-on: ubuntu-latest
    env:
      STELLAR_CLI_VERSION: 28.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Prebuilt binary rather than `cargo install stellar-cli`: building from
      # source pulls libdbus-sys, whose system dependency (libdbus-1-dev) is not
      # present on ubuntu-latest, and took 13 minutes before failing.
      - name: Cache Stellar CLI
        id: stellar-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/stellar
          key: stellar-cli-${{ env.STELLAR_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Stellar CLI
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)  target=x86_64-unknown-linux-gnu;  sha=207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc ;;
            aarch64) target=aarch64-unknown-linux-gnu; sha=8d8e5ea9bb441a19e99a7a7a4809df3f758c9654265c76953436fb7e9288b9ff ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac

          archive="stellar-cli-${STELLAR_CLI_VERSION}-${target}.tar.gz"
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${archive}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 "$url" -o /tmp/stellar-cli.tar.gz

          # The release publishes no checksum file, so the digest of the exact
          # artifact is pinned here. A silently replaced release asset fails the
          # build instead of running unverified code on a runner with repo
          # credentials.
          echo "${sha}  /tmp/stellar-cli.tar.gz" | sha256sum --check --strict

          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp stellar
          install -m 0755 /tmp/stellar "$HOME/.local/bin/stellar"

      - name: Verify Stellar CLI
        run: |
          set -euo pipefail
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version | tee /tmp/stellar-version
          grep -q "^stellar ${STELLAR_CLI_VERSION} " /tmp/stellar-version

      - run: stellar contract build

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Private development context and secrets must never enter the public repo.
      - name: Assert private files are not tracked
        run: |
          set -e
          for f in AGENT.md AGENTS.md MILVANCE_SSOT.md .env; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f must not be tracked in Git"
              exit 1
            fi
          done

      - name: Assert no committed key material
        run: |
          set -e
          if git ls-files | grep -E '\.(pem|key|jwt)$'; then
            echo "::error::key material must not be committed"
            exit 1
          fi
